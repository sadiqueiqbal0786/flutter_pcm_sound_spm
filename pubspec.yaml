name: flutter_pcm_sound_spm
description: >-
  Send real-time PCM audio (16-bit integer) to the device speakers on Android,
  iOS, macOS and web. Swift Package Manager compatible fork of
  flutter_pcm_sound.
version: 1.1.0
homepage: https://github.com/sadiqueiqbal0786/flutter_pcm_sound_spm
repository: https://github.com/sadiqueiqbal0786/flutter_pcm_sound_spm
issue_tracker: https://github.com/sadiqueiqbal0786/flutter_pcm_sound_spm/issues
topics:
  - audio
  - pcm
  - sound

environment:
  # package:web (used by the web implementation) needs Dart 3.3.
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sadiqueiqbal.flutter_pcm_sound_spm
        pluginClass: FlutterPcmSoundPlugin
      ios:
        pluginClass: FlutterPcmSoundPlugin
        sharedDarwinSource: false
      macos:
        pluginClass: FlutterPcmSoundPlugin
        sharedDarwinSource: false
      web:
        pluginClass: FlutterPcmSoundWeb
        fileName: flutter_pcm_sound_spm_web.dart
